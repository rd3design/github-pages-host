name: Sync PDFs to Cloudflare R2

on:
  # Nightly — just pulls latest projects.json, no heavy PDF processing
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - fetch but do not upload, just report'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Force re-upload even if already in R2'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: 'Max PDFs to process (0 = all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @aws-sdk/client-s3

      - name: Run PDF sync (fallback - Dropbox source)
        env:
          R2_ACCOUNT_ID:    "${{ secrets.R2_ACCOUNT_ID }}"
          R2_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_SECRET_KEY:    "${{ secrets.R2_SECRET_KEY }}"
          R2_BUCKET:        "${{ secrets.R2_BUCKET }}"
          R2_PUBLIC_URL:    "${{ secrets.R2_PUBLIC_URL }}"
          DRY_RUN:          "${{ github.event.inputs.dry_run || 'false' }}"
          FORCE:            "${{ github.event_name == 'schedule' && 'true' || github.event.inputs.force || 'false' }}"
          LIMIT:            "${{ github.event.inputs.limit || '0' }}"
        run: node .github/scripts/sync-pdfs.js

      - name: Commit updated projects.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: update R2 PDF links" && git push
